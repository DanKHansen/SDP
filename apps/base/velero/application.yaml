# apps/base/velero/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts/
    targetRevision: 12.1.0
    chart: velero
    helm:
      releaseName: velero
      values: |
        image:
          repository: velero/velero
          tag: v1.18.1
          pullPolicy: IfNotPresent

        configuration:
          defaultVolumesToFsBackup: true
          backupStorageLocation:
            - name: default
              provider: aws
              bucket: sdp-backups-hel1
              default: true
              credential:
                name: cloud
                key: cloud
              config:
                region: hel1
                s3Url: https://hel1.your-objectstorage.com
                s3ForcePathStyle: "true"

        snapshotsEnabled: false

        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.2
            imagePullPolicy: IfNotPresent
            volumeMounts:
              - mountPath: /target
                name: plugins

        credentials:
          useSecret: false
          existingSecret: cloud

        deployNodeAgent: true
        nodeAgent:
          resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 100m
              memory: 512Mi

        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi

        logLevel: info
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m