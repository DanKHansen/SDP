apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts/
    targetRevision: 12.1.0
    chart: velero
    helm:
      releaseName: velero
      parameters:
        # Image configuration
        - name: image.repository
          value: velero/velero
        - name: image.tag
          value: v1.18.1
        - name: image.pullPolicy
          value: IfNotPresent

        # AWS provider
        - name: configuration.providers[0]
          value: aws

        # Backup Storage Location
        - name: configuration.backupStorageLocations[0].provider
          value: aws
        - name: configuration.backupStorageLocations[0].default
          value: "true"
        - name: configuration.backupStorageLocations[0].credential.name
          value: cloud
        - name: configuration.backupStorageLocations[0].credential.key
          value: cloud
        - name: configuration.backupStorageLocations[0].objectStorage.bucket
          value: sdp-backups-hel1
        - name: configuration.backupStorageLocations[0].config.region
          value: hel1-dc2
        - name: configuration.backupStorageLocations[0].config.s3Url
          value: https://hsn.hel1.cloud.netapp.com
        - name: configuration.backupStorageLocations[0].config.s3ForcePathStyle
          value: "true"
        - name: configuration.backupStorageLocations[0].config.insecureSkipTLSVerify
          value: "false"

        # No volume snapshots (S3-only backup)
        - name: configuration.volumeSnapshotLocations
          value: "[]"

        # Credentials reference
        - name: credentials.useSecret
          value: "false"
        - name: credentials.existingSecret
          value: cloud

        # Init container for AWS plugin
        - name: initContainers[0].name
          value: velero-plugin-for-aws
        - name: initContainers[0].image
          value: velero/velero-plugin-for-aws:v1.14.2
        - name: initContainers[0].imagePullPolicy
          value: IfNotPresent
        - name: initContainers[0].volumeMounts[0].mountPath
          value: /target

        # Restic for PV backups
        - name: restic.enable
          value: "true"
        - name: restic.privileged
          value: "false"

        # Resource limits
        - name: resources.limits.cpu
          value: 1000m
        - name: resources.limits.memory
          value: 2Gi
        - name: resources.requests.cpu
          value: 500m
        - name: resources.requests.memory
          value: 1Gi
        - name: resticResources.limits.cpu
          value: 500m
        - name: resticResources.limits.memory
          value: 1Gi
        - name: resticResources.requests.cpu
          value: 100m
        - name: resticResources.requests.memory
          value: 512Mi
        # Logging
        - name: logLevel
          value: info
        - name: deploySchedule
          value: "false"
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 5m